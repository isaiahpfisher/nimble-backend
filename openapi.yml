openapi: 3.0.3
info:
  title: Nimble Backend API
  version: 1.0.0
  description: >
    REST API for Nimble, an agile project-management backend built with
    Node.js, Express and Sequelize.


    ## Authentication

    Three ways to obtain or present credentials:

    - **Basic auth** (`Authorization: Basic <base64(email:password)>`) is used
      only by `POST /login` to exchange credentials for a session token.
    - **GitHub OAuth** — `POST /github/login` exchanges a GitHub authorization
      code for the same session token, creating the user on first login.
    - **Bearer token** (`Authorization: Bearer <token>`) is used by all
      protected endpoints. The token is the encrypted session id returned by
      `POST /login`, `POST /github/login` or `POST /users`.

    Tokens expire 24 hours after they are issued.


    ## Error responses

    Unless noted otherwise, every non-2xx response is a JSON object with a
    single `message` string. Handlers fall back to `500` when no explicit
    status code was set, so a malformed request can surface as a `500`.


    ## A note on authorization

    Endpoints marked with `bearerAuth` only verify that the caller holds a
    valid, unexpired session. With few exceptions (comment edit/delete, which
    check ownership) there is **no** check that the caller is a member of the
    project being modified.
servers:
  - url: http://localhost:3200/nimbleapi
    description: Local development server (default PORT 3200)
tags:
  - name: Auth
    description: Login and logout
  - name: Users
    description: User management
  - name: Projects
    description: Project management
  - name: Project Members
    description: Project membership
  - name: Story States
    description: Per-project workflow states
  - name: Story Types
    description: Per-project story types
  - name: Sprints
    description: Sprint planning, including recurring sprints
  - name: Stories
    description: Stories and their relations
  - name: Acceptance Criteria
    description: Acceptance criteria on a story
  - name: Comments
    description: Comments on stories and acceptance criteria
  - name: Activity
    description: Activity history
  - name: Reference / Read-only
    description: >
      Unscoped collection endpoints that dump every row of a table. Unused by
      the app itself; handy for debugging.

paths:
  # ---------------------------------------------------------------- Auth ----
  /login:
    post:
      tags: [Auth]
      summary: Log in with credentials
      description: >
        Authenticates a user via HTTP Basic auth and creates a new session.
        Returns the user profile together with a bearer token valid for 24 hours.
      security:
        - basicAuth: []
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email }
                  firstName: { type: string }
                  lastName: { type: string }
                  isAdmin: { type: boolean }
                  token:
                    type: string
                    description: Bearer token for the Authorization header.
        "401":
          description: Invalid password, user not found, or missing credentials
        "500":
          description: Error creating the session

  /logout:
    post:
      tags: [Auth]
      summary: Log out
      description: >
        Destroys the session associated with the supplied bearer token.
        The handler never calls `res.send`, so the request hangs until the
        client times out; nothing is returned.
      security:
        - bearerAuth: []
      responses:
        default:
          description: No response is sent.

  /github/login:
    post:
      tags: [Auth]
      summary: Log in with a GitHub OAuth code
      description: >
        Exchanges a GitHub authorization code for an access token, looks up the
        GitHub profile, and finds or creates the matching Nimble user by
        `githubId`. Returns the same payload as `POST /login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Authorization code from the GitHub OAuth redirect.
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email, nullable: true }
                  firstName: { type: string }
                  lastName: { type: string }
                  isAdmin: { type: boolean }
                  token: { type: string }
        "400":
          description: Missing GitHub code
        "401":
          description: GitHub authorization failed
        "403":
          description: Unable to verify the GitHub account
        "500":
          description: Error during GitHub authentication

  # --------------------------------------------------------------- Users ----
  /users:
    post:
      tags: [Users]
      summary: Create a new user
      description: >
        Registers a new user, creates a session and returns the user profile
        with a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                id:
                  type: integer
                  description: Optional explicit primary key.
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: User created (returns profile and token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  email: { type: string, format: email }
                  firstName: { type: string }
                  lastName: { type: string }
                  isAdmin: { type: boolean }
                  token: { type: string }
        "400":
          description: A required field is missing, or the email is already in use
        "500":
          description: Error creating the user
    get:
      tags: [Users]
      summary: List users
      description: >
        Returns all users. Only `id`, `isAdmin`, `firstName`, `lastName` and
        `email` are selected — password and salt are never included.
      parameters:
        - name: id
          in: query
          required: false
          description: Filter users by a partial (SQL LIKE) id match.
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    firstName: { type: string }
                    lastName: { type: string }
                    email: { type: string, format: email }
                    isAdmin: { type: boolean }
        "500":
          description: Error retrieving users
    delete:
      tags: [Users]
      summary: Delete all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error removing users

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Users]
      summary: Get a user by id
      responses:
        "200":
          description: The requested user (id, isAdmin, firstName, lastName, email)
        "404":
          description: User not found
        "500":
          description: Error retrieving user
    put:
      tags: [Users]
      summary: Update a user
      description: >
        Every listed field is written, so omitting one clears it. Responds with
        the submitted values rather than the reloaded record.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                isAdmin: { type: boolean }
      responses:
        "200":
          description: The updated field values
        "401":
          description: Missing or expired bearer token
        "404":
          description: User not found
        "500":
          description: Error updating user
    delete:
      tags: [Users]
      summary: Delete a user by id
      description: >
        Returns `200` with an explanatory message even when no user matched.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error deleting user

  # ------------------------------------------------------------ Projects ----
  /projects:
    get:
      tags: [Projects]
      summary: List all projects
      description: Includes each project's members and their user profiles.
      responses:
        "200":
          description: List of projects
        "500":
          description: Error retrieving projects
    post:
      tags: [Projects]
      summary: Create a project
      description: >
        Creates a project, adds the authenticated user as a manager, and seeds
        the default story types (Feature, Bug, Chore) and story states
        (Not Started, In Progress, Ready for Test, In Test, Done). The last
        seeded state becomes the project's `completedState`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, deadline]
              properties:
                title: { type: string }
                description: { type: string }
                deadline:
                  type: string
                  format: date-time
                  description: Must be a valid date in the future.
      responses:
        "200":
          description: The created project
        "400":
          description: Missing required fields, or deadline is invalid or in the past
        "401":
          description: Authentication required
        "500":
          description: Error creating project

  /admin/projects:
    post:
      tags: [Projects]
      summary: Create a project on behalf of a manager
      description: >
        Same as `POST /projects`, but assigns `managerId` as the manager
        instead of the caller. Note that the caller's `isAdmin` flag is never
        checked — any valid session may call this.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, deadline, managerId]
              properties:
                title: { type: string }
                description: { type: string }
                deadline: { type: string, format: date-time }
                managerId:
                  type: integer
                  description: Id of the user to assign as project manager.
      responses:
        "200":
          description: The created project
        "400":
          description: Missing required fields or invalid deadline
        "401":
          description: Authentication required
        "404":
          description: Manager user not found
        "500":
          description: Error creating project

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Projects]
      summary: Get a project by id
      description: >
        Includes story types, story states, sprints, repositories, the
        branch-creation and PR-review states, and members with their profiles.
      responses:
        "200":
          description: The requested project
        "404":
          description: Project not found
        "500":
          description: Error retrieving project
    put:
      tags: [Projects]
      summary: Update a project
      description: >
        Only the listed fields are written; omitting one clears it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                deadline:
                  type: string
                  format: date-time
                  description: If provided, must be a valid date in the future.
                branchCreationStateId:
                  type: integer
                  nullable: true
                  description: State a story moves to when a branch is created.
                prReviewStateId:
                  type: integer
                  nullable: true
                  description: State a story moves to when a PR opens.
                completedStateId:
                  type: integer
                  nullable: true
                  description: >
                    State that marks a story complete; entering it stamps the
                    story's `completedAt`. Must reference an existing state.
      responses:
        "200":
          description: The updated project
        "400":
          description: Invalid deadline or invalid completed state
        "401":
          description: Authentication required
        "404":
          description: Project not found
        "500":
          description: Error updating project
    delete:
      tags: [Projects]
      summary: Delete a project
      description: Cascades to members, states, types, sprints, repositories and stories.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Authentication required
        "404":
          description: Project not found
        "500":
          description: Error deleting project

  /users/me/projects:
    get:
      tags: [Projects]
      summary: List the authenticated user's projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects the authenticated user is a member of
        "401":
          description: Authentication required
        "500":
          description: Error retrieving projects

  # ----------------------------------------------------- Project members ----
  /projectMembers:
    get:
      tags: [Project Members]
      summary: List all project members
      responses:
        "200":
          description: List of project members
        "500":
          description: Server error

  /projectMembers/user/{userId}:
    get:
      tags: [Project Members]
      summary: List memberships for a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Memberships belonging to the user
        "401":
          description: Authentication required
        "500":
          description: Server error

  /projectMembers/project/{projectId}:
    get:
      tags: [Project Members]
      summary: List members of a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Memberships belonging to the project
        "500":
          description: Server error

  /projectMembers/{project}/{member}:
    post:
      tags: [Project Members]
      summary: Add a member to a project
      description: >
        The `project` and `member` path segments are required by the route but
        ignored — the membership is built entirely from the request body. Note
        that `isManager` is falsy-checked, so `false` is rejected as missing;
        send the string `"false"` for a non-manager.
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Ignored by the handler.
          schema: { type: string }
        - name: member
          in: path
          required: true
          description: Ignored by the handler.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, projectId, isManager]
              properties:
                userId: { type: integer }
                projectId: { type: integer }
                isManager:
                  type: string
                  description: Stored as a string column.
      responses:
        "200":
          description: The created membership
        "400":
          description: Missing required fields
        "401":
          description: Authentication required
        "500":
          description: Error creating projectMember

  /projectMembers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Project Members]
      summary: Update a membership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isManager: { type: string }
      responses:
        "200":
          description: The updated membership
        "401":
          description: Authentication required
        "404":
          description: ProjectMember not found
        "500":
          description: Error updating projectMember
    delete:
      tags: [Project Members]
      summary: Remove a membership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Authentication required
        "404":
          description: ProjectMember not found
        "500":
          description: Error deleting projectMember

  # -------------------------------------------------------- Story states ----
  /projects/{projectId}/storyStates:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Story States]
      summary: List a project's story states
      description: Ordered by `order` ascending.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of story states
        "401":
          description: Missing or expired bearer token
        "500":
          description: Server error
    post:
      tags: [Story States]
      summary: Create a story state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, order]
              properties:
                name: { type: string }
                order:
                  type: integer
                  description: Must be non-zero; `0` is rejected as missing.
      responses:
        "200":
          description: The created story state
        "400":
          description: Missing required fields, or the name is already used in this project
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error creating story state

  /projects/{projectId}/storyStates/reorder:
    put:
      tags: [Story States]
      summary: Bulk-reorder story states
      description: >
        Upserts the supplied rows, updating `name` and `order`. Each entry must
        carry the state's `id`; rows are not validated against `projectId`.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [states]
              properties:
                states:
                  type: array
                  items:
                    type: object
                    required: [id, name, order]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      order: { type: integer }
                      projectId: { type: integer }
      responses:
        "200":
          description: Reorder succeeded
        "401":
          description: Missing or expired bearer token
        "500":
          description: Failed to reorder states

  /projects/{projectId}/storyStates/{stateId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: stateId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Story States]
      summary: Rename a story state
      description: This route has no authentication middleware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The updated story state
        "400":
          description: Missing name, or the name is already used in this project
        "404":
          description: StoryState not found in this project
        "500":
          description: Error updating story state
    delete:
      tags: [Story States]
      summary: Delete a story state
      description: >
        Moves every story in this state to `fallbackStateId` first. This route
        has no authentication middleware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fallbackStateId]
              properties:
                fallbackStateId:
                  type: integer
                  description: State that orphaned stories are moved to.
      responses:
        "200":
          description: Deletion result message
        "400":
          description: Missing fallbackStateId
        "404":
          description: StoryState not found in this project
        "500":
          description: Error deleting story state

  # --------------------------------------------------------- Story types ----
  /projects/{projectId}/storyTypes:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Story Types]
      summary: List a project's story types
      description: Each type includes its stories.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of story types
        "401":
          description: Missing or expired bearer token
        "500":
          description: Server error
    post:
      tags: [Story Types]
      summary: Create a story type
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The created story type
        "400":
          description: Missing name, or the name is already used in this project
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error creating story type

  /projects/{projectId}/storyTypes/{typeId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: typeId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Story Types]
      summary: Rename a story type
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The updated story type
        "400":
          description: Missing name, or the name is already used in this project
        "401":
          description: Missing or expired bearer token
        "404":
          description: StoryType not found in this project
        "500":
          description: Error updating story type
    delete:
      tags: [Story Types]
      summary: Delete a story type
      description: Stories referencing this type have their `typeId` set to null.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Missing or expired bearer token
        "404":
          description: StoryType not found in this project
        "500":
          description: Error deleting story type

  # ------------------------------------------------------------- Sprints ----
  /sprints:
    post:
      tags: [Sprints]
      summary: Create a sprint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startDate, endDate, projectId]
              properties:
                title: { type: string }
                goal: { type: string, nullable: true }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                status:
                  type: string
                  enum: [Planned, Active, Completed]
                  default: Planned
                projectId: { type: integer }
      responses:
        "200":
          description: The created sprint
        "400":
          description: Missing required fields
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error creating Sprint

  /sprints/recurring:
    post:
      tags: [Sprints]
      summary: Create a series of recurring sprints
      description: >
        Creates `recurrenceCount` sprints of the same length, spaced by the
        recurrence pattern (Weekly = 7 days, Biweekly = 14, Monthly = 30), all
        sharing a generated `recurrenceGroupId`. Titles are suffixed with the
        sequence number.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [title, startDate, endDate, projectId, recurrencePattern, recurrenceCount]
              properties:
                title: { type: string }
                goal: { type: string, nullable: true }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                projectId: { type: integer }
                recurrencePattern:
                  type: string
                  enum: [Weekly, Biweekly, Monthly]
                recurrenceCount:
                  type: integer
                  minimum: 2
      responses:
        "200":
          description: The created sprints
        "400":
          description: >
            Missing required fields, recurrenceCount below 2, or an unknown
            recurrence pattern
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error creating recurring Sprints

  /projects/{projectId}/sprints:
    get:
      tags: [Sprints]
      summary: List a project's sprints
      description: Ordered by `startDate` ascending.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of sprints
        "401":
          description: Missing or expired bearer token
        "500":
          description: Error retrieving Sprints for project

  /sprints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Sprints]
      summary: Get a sprint by id
      description: Includes the parent project and the sprint's stories.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The requested sprint
        "401":
          description: Missing or expired bearer token
        "404":
          description: Sprint not found
        "500":
          description: Error retrieving Sprint
    put:
      tags: [Sprints]
      summary: Update a sprint
      description: The request body is passed straight to the model update.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                goal: { type: string, nullable: true }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                status:
                  type: string
                  enum: [Planned, Active, Completed]
                isRecurring: { type: boolean }
                recurrencePattern:
                  type: string
                  enum: [Weekly, Biweekly, Monthly]
                  nullable: true
                recurrenceGroupId: { type: string, nullable: true }
      responses:
        "200":
          description: The updated sprint
        "401":
          description: Missing or expired bearer token
        "404":
          description: Sprint not found
        "500":
          description: Error updating Sprint
    delete:
      tags: [Sprints]
      summary: Delete a sprint
      description: Stories in the sprint have their `sprintId` set to null.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Missing or expired bearer token
        "404":
          description: Sprint not found
        "500":
          description: Error deleting Sprint

  # ------------------------------------------------------------- Stories ----
  /projects/{id}/stories:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Stories]
      summary: List a project's stories
      description: >
        Each story includes its state, type, repository, project, sprint,
        reporter, assignee, reviewer, acceptance criteria and comments.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of stories
        "401":
          description: Missing or expired bearer token
        "500":
          description: Server error
    post:
      tags: [Stories]
      summary: Create a story
      description: >
        The reporter is taken from the session. Records a `created` activity
        entry and emails the assignee and reviewer when they are set to someone
        other than the caller; email failures are logged, not returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, stateId]
              properties:
                title: { type: string }
                description: { type: string }
                stateId: { type: integer }
                typeId: { type: integer, nullable: true }
                priority: { type: string, nullable: true }
                estimate: { type: integer, nullable: true }
                sprintId: { type: integer, nullable: true }
                repositoryId: { type: integer, nullable: true }
                assigneeId: { type: integer, nullable: true }
                reviewerId: { type: integer, nullable: true }
      responses:
        "200":
          description: The created story
        "400":
          description: Missing required fields
        "401":
          description: Authentication required
        "404":
          description: Project not found
        "500":
          description: Error creating story

  /projects/{projectId}/stories/{storyId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: storyId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Stories]
      summary: Get a story by id
      description: >
        Includes state, type, repository, project, sprint, reporter, assignee,
        reviewer, acceptance criteria, comments and both directions of its
        relations. `projectId` is not used to scope the lookup.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The requested story
        "401":
          description: Missing or expired bearer token
        "404":
          description: Story not found
        "500":
          description: Error retrieving story
    put:
      tags: [Stories]
      summary: Update a story
      description: >
        Only supplied fields are written. Moving the story into the project's
        `completedState` stamps `completedAt`. Every changed field is recorded
        as an activity change; new assignees and reviewers are emailed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                typeId: { type: integer, nullable: true }
                stateId: { type: integer }
                priority: { type: string, nullable: true }
                estimate: { type: integer, nullable: true }
                sprintId: { type: integer, nullable: true }
                repositoryId: { type: integer, nullable: true }
                assigneeId: { type: integer, nullable: true }
                reviewerId: { type: integer, nullable: true }
      responses:
        "200":
          description: The updated story
        "400":
          description: title, description or stateId was supplied but empty
        "401":
          description: Authentication required
        "404":
          description: Story not found
        "500":
          description: Error updating story
    delete:
      tags: [Stories]
      summary: Delete a story
      description: Cascades to acceptance criteria, comments, relations and activity.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Authentication required
        "404":
          description: Story not found
        "500":
          description: Error deleting story

  /projects/{projectId}/stories/{storyId}/relations:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: storyId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Stories]
      summary: Relate two stories
      description: >
        Both stories must belong to the project, one of them must be the story
        in the path, and the pair must not already be related in either
        direction. Records an activity entry on both stories.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, storyOneId, storyTwoId]
              properties:
                type:
                  type: string
                  enum: [BLOCKS, RELATES_TO, DUPLICATES, PARENT_OF]
                storyOneId:
                  type: integer
                  description: Source side; must be a number, not a string.
                storyTwoId:
                  type: integer
                  description: Target side; must be a number, not a string.
      responses:
        "200":
          description: The created relation
        "400":
          description: >
            Invalid type, self-relation, the path story is not part of the
            relation, a story is missing from the project, or the stories are
            already related
        "401":
          description: Authentication required
        "500":
          description: Error creating relation

  /projects/{projectId}/stories/{storyId}/relations/{relationId}:
    delete:
      tags: [Stories]
      summary: Delete a relation
      description: >
        The relation is matched on `storyOneId`, so it can only be deleted from
        the source story's side. Records an activity entry on both stories.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
        - name: storyId
          in: path
          required: true
          schema: { type: integer }
        - name: relationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Authentication required
        "404":
          description: Relation not found for this story
        "500":
          description: Error deleting relation

  # -------------------------------------------------- Acceptance criteria ---
  /projects/{projectId}/stories/{storyId}/acceptanceCriteria:
    post:
      tags: [Acceptance Criteria]
      summary: Add an acceptance criterion to a story
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
        - name: storyId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, status]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string }
      responses:
        "200":
          description: The created criterion
        "400":
          description: Missing title or status
        "401":
          description: Authentication required
        "404":
          description: Story not found in this project
        "500":
          description: Error creating acceptance criteria

  /projects/{projectId}/stories/{storyId}/acceptanceCriteria/{criterionId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: storyId
        in: path
        required: true
        schema: { type: integer }
      - name: criterionId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Acceptance Criteria]
      summary: Update an acceptance criterion
      description: >
        Title, description and status are all written, so omitting one clears
        it. Changed fields are recorded as activity changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, status]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string }
      responses:
        "200":
          description: The updated criterion
        "400":
          description: Missing title or status
        "401":
          description: Authentication required
        "404":
          description: Story or criterion not found
        "500":
          description: Error updating acceptance criteria
    delete:
      tags: [Acceptance Criteria]
      summary: Delete an acceptance criterion
      description: Records a `deleted` activity entry before removing the row.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "401":
          description: Authentication required
        "404":
          description: Story or criterion not found
        "500":
          description: Error deleting acceptance criteria

  # ------------------------------------------------------------ Comments ----
  /projects/{projectId}/stories/{storyId}/comments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: storyId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Comments]
      summary: List a story's comments
      description: Each comment includes its author.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of comments
        "401":
          description: Missing or expired bearer token
        "404":
          description: Story not found
        "500":
          description: Server error
    post:
      tags: [Comments]
      summary: Comment on a story
      description: >
        Records a `created` activity entry and emails any users mentioned in
        the content. Mentions are parsed out of `data-id="<userId>"` attributes
        in the comment HTML.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: HTML body; mentions carry a `data-id` attribute.
      responses:
        "200":
          description: The created comment, including its author
        "400":
          description: Missing content
        "401":
          description: Authentication required
        "404":
          description: Story not found
        "500":
          description: Error creating comment

  /projects/{projectId}/stories/{storyId}/acceptanceCriteria/{criterionId}/comments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer }
      - name: storyId
        in: path
        required: true
        schema: { type: integer }
      - name: criterionId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Comments]
      summary: List an acceptance criterion's comments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of comments
        "401":
          description: Missing or expired bearer token
        "404":
          description: Acceptance criteria not found
        "500":
          description: Server error
    post:
      tags: [Comments]
      summary: Comment on an acceptance criterion
      description: >
        The activity entry is filed against the criterion's parent story.
        Mentioned users are emailed with links to both the story and the
        criterion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: The created comment, including its author
        "400":
          description: Missing content
        "401":
          description: Authentication required
        "404":
          description: Acceptance criteria not found
        "500":
          description: Error creating comment

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Comments]
      summary: Edit a comment
      description: >
        Only the comment's author may edit it. No activity entry is recorded
        for edits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        "200":
          description: The updated comment
        "400":
          description: Comment not found, or the caller is not its author
        "401":
          description: Authentication required
        "500":
          description: Error updating comment
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: >
        Only the comment's author may delete it. Records a `deleted` activity
        entry against the story the comment belongs to.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion result message
        "400":
          description: Comment not found, or the caller is not its author
        "401":
          description: Authentication required
        "500":
          description: Error deleting comment

  # ------------------------------------------------------------ Activity ----
  /projects/{projectId}/stories/{storyId}/activity:
    get:
      tags: [Activity]
      summary: Get a story's activity history
      description: >
        Newest first. Each entry includes the acting user, the story, and the
        per-attribute changes. Entries carry a `subjectType` of `story`,
        `acceptanceCriteria`, `comment` or `relation` plus a `metadata` blob so
        they still render after the subject is deleted. This route has no
        authentication middleware.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer }
        - name: storyId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Activity entries for the story
        "500":
          description: Story not found, or another error occurred
  # -------------------------------------------------- Reference endpoints ---
  /stories:
    get:
      tags: [Reference / Read-only]
      summary: List every story in every project
      responses:
        "200": { description: List of stories }
        "500": { description: Server error }

  /relations:
    get:
      tags: [Reference / Read-only]
      summary: List every relation
      responses:
        "200": { description: List of relations }
        "500": { description: Server error }

  /acceptanceCriteria:
    get:
      tags: [Reference / Read-only]
      summary: List every acceptance criterion
      responses:
        "200": { description: List of acceptance criteria }
        "500": { description: Server error }

  /comments:
    get:
      tags: [Reference / Read-only]
      summary: List every comment
      responses:
        "200": { description: List of comments }
        "500": { description: Server error }

  /activities:
    get:
      tags: [Reference / Read-only]
      summary: List every activity entry
      responses:
        "200": { description: List of activities }
        "500": { description: Server error }

  /storyStates:
    get:
      tags: [Reference / Read-only]
      summary: List every story state
      responses:
        "200": { description: List of story states, ordered by `order` }
        "500": { description: Server error }

  /storyTypes:
    get:
      tags: [Reference / Read-only]
      summary: List every story type
      responses:
        "200": { description: List of story types }
        "500": { description: Server error }

  /repositories:
    get:
      tags: [Reference / Read-only]
      summary: List every repository
      responses:
        "200": { description: List of repositories }
        "500": { description: Server error }

  /retrospectives:
    get:
      tags: [Reference / Read-only]
      summary: List every retrospective
      description: Retrospectives have no write endpoints yet.
      responses:
        "200": { description: List of retrospectives }
        "500": { description: Server error }

  /standups:
    get:
      tags: [Reference / Read-only]
      summary: List every standup
      description: Standups have no write endpoints yet.
      responses:
        "200": { description: List of standups }
        "500": { description: Server error }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "Base64-encoded email:password. Used only by POST /login."
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Encrypted session id issued by POST /login, POST /github/login or
        POST /users.
